[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "development-bridge"
version = "0.0.0"
description = "Migration baseline for the Development Bridge MCP service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.0.0",
    "patch-ng>=1.19,<2",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
# Required only by the preserved legacy github_status tool. GitHub will move
# behind an optional integration boundary during the staged migration.
github = ["PyGithub>=2.10,<3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "development-bridge"
version = "0.0.0"
description = "Migration baseline for the Development Bridge MCP service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.0.0",
    "pydantic>=2.13,<3",
    "PyYAML>=6,<7",
    "Telethon>=1.44,<2",
    "pypdf>=6,<7",
    "uvicorn>=0.52,<1",
]

[project.scripts]
development-bridge-import-telegram = "app.knowledge.cli:main"
development-bridge-telegram-auth = "app.knowledge.telegram_auth:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

<!doctype html>
<meta charset="utf-8">
<title>X External Trigger Probe</title>
<h3>X External Trigger Probe</h3>
<pre id="s">boot</pre>
<script type="module">
import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js";

const BASE = "https://mcp.vigilante.website/sampling-probe";
const out = document.getElementById("s");
const log = (x) => { out.textContent += "\n" + x; };
const app = new App({ name: "X External Trigger Probe", version: "1.0.0" }, {});
let lastGeneration = 0;
let busy = false;

async function poll() {
  if (busy) return;
  try {
    const state = await fetch(`${BASE}/x-event?t=${Date.now()}`, { cache: "no-store" }).then(r => r.json());
    const generation = Number(state.generation || 0);
    if (generation <= lastGeneration || !state.message) return;
    lastGeneration = generation;
    busy = true;
    const claim = await fetch(`${BASE}/x-claim?generation=${generation}`, {
      method: "POST",
      cache: "no-store",
    }).then(r => r.json());
    if (!claim.claimed) {
      log(`generation ${generation} already claimed`);
      return;
    }
    log(`external generation ${generation} claimed`);
    const result = await app.sendMessage({
      role: "user",
      content: [{ type: "text", text: String(state.message) }],
    });
    log(`sendMessage generation ${generation}: ${JSON.stringify(result)}`);
  } catch (e) {
    log(`poll/send error: ${String(e)}`);
  } finally {
    busy = false;
  }
}

try {
  await app.connect();
  log("connected; waiting for VPS event");
  const initial = await fetch(`${BASE}/x-event?t=${Date.now()}`, { cache: "no-store" }).then(r => r.json());
  lastGeneration = Number(initial.generation || 0);
  setInterval(poll, 1000);
} catch (e) {
  log(`connect error: ${String(e)}`);
}
</script>

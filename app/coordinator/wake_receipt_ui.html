<!doctype html>
<meta charset="utf-8">
<title>Development Bridge Wake Receipt</title>
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
body { font: 13px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: CanvasText; }
#receipt { box-sizing: border-box; width: 100%; min-height: 38px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid color-mix(in srgb, AccentColor 30%, transparent); border-radius: 12px; background: color-mix(in srgb, Canvas 94%, AccentColor 6%); }
#icon { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; background: color-mix(in srgb, AccentColor 14%, transparent); font-size: 14px; }
#name { font-weight: 650; }
#detail { margin-top: 2px; color: GrayText; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#state { color: AccentColor; font-size: 12px; white-space: nowrap; }
</style>
<div id="receipt" role="status" aria-live="polite">
  <div id="icon">⚡</div>
  <div>
    <div id="name">Wake доставлен</div>
    <div id="detail">Bridge разбудил ChatGPT и продолжил задачу</div>
  </div>
  <div id="state">ACK</div>
</div>
<script type="module">
import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js";

const app = new App({ name: "Development Bridge Wake Receipt", version: "1.0.0" }, { autoResize: true });
const detailEl = document.getElementById("detail");
const stateEl = document.getElementById("state");
const receipt = document.getElementById("receipt");

function resize() {
  requestAnimationFrame(() => {
    const height = Math.max(38, Math.ceil(receipt.getBoundingClientRect().height));
    try { app.sendSizeChanged({ height }); } catch (_) {}
  });
}

app.ontoolresult = (result) => {
  const data = result?.structuredContent || {};
  const attempts = Number(data.delivery_attempts || 0);
  const batched = Number(data.batched_count || 0);
  const acknowledged = data.acknowledged === true;
  const parts = ["Bridge разбудил ChatGPT и продолжил задачу"];
  if (attempts > 0) parts.push("доставка " + attempts);
  if (batched > 0) parts.push("пакет " + batched);
  detailEl.textContent = parts.join(" · ");
  stateEl.textContent = acknowledged ? "ACK ✓" : "ACK ?";
  resize();
};

try {
  await app.connect();
  resize();
} catch (_) {
  stateEl.textContent = "ACK";
  resize();
}
</script>

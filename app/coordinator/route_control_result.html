<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Development Bridge — Route Control</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #181b24;
      --border: #2b3040;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --primary: #238636;
      --primary-hover: #2ea043;
      --primary-text: #ffffff;
      --btn-secondary-bg: #21262d;
      --btn-secondary-border: #363b42;
      --code-bg: #161b22;
      --code-border: #30363d;
      --accent: #58a6ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --card-bg: #ffffff;
        --border: #d0d7de;
        --text: #1f2328;
        --text-muted: #656d76;
        --primary: #1f883d;
        --primary-hover: #1a7f37;
        --primary-text: #ffffff;
        --btn-secondary-bg: #f6f8fa;
        --btn-secondary-border: #d0d7de;
        --code-bg: #f6f8fa;
        --code-border: #d0d7de;
        --accent: #0969da;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
    }
    .status-icon {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 1rem;
      user-select: none;
    }
    .status-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .status-msg {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .status-msg code {
      background-color: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 4px;
      padding: 0.15rem 0.35rem;
      font-size: 0.9em;
      color: var(--text);
    }
    .subtext {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-summary {
      background-color: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
      font-size: 0.9rem;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
    }
    .meta-label {
      color: var(--text-muted);
    }
    .meta-value {
      font-weight: 500;
    }
    .meta-value code {
      font-size: 0.9em;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-text);
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      border-color: var(--btn-secondary-border);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: var(--border);
    }
    form {
      margin: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="status-icon" class="status-icon">__STATUS_ICON__</div>
    <h1 id="status-title" class="status-title">__STATUS_TITLE__</h1>
    <div id="status-msg" class="status-msg">__STATUS_MESSAGE__</div>
    __META_SUMMARY__
    <div id="actions" class="actions">__ACTIONS__</div>
  </div>
  __AUTO_COMMIT_SCRIPT__
</body>
</html>

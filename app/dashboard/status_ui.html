<!doctype html>
<meta charset="utf-8">
<title>Development Bridge</title>
<style>
:root { color-scheme: light dark; }
html,body { margin:0; padding:0; background:transparent; overflow:hidden; }
body { font:13px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:CanvasText; }
.card { box-sizing:border-box; width:100%; padding:12px 14px; border:1px solid color-mix(in srgb,CanvasText 14%,transparent); border-radius:14px; background:color-mix(in srgb,Canvas 94%,CanvasText 6%); }
.head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.title { font-weight:700; font-size:14px; }
.badge { padding:3px 8px; border-radius:999px; background:color-mix(in srgb,#16a34a 14%,transparent); color:#16a34a; font-weight:650; font-size:11px; }
.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:10px; }
.cell { min-width:0; padding:8px 9px; border-radius:10px; background:color-mix(in srgb,CanvasText 5%,transparent); }
.k { color:GrayText; font-size:11px; }
.v { margin-top:2px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.progress { display:none; margin-top:10px; padding-top:10px; border-top:1px solid color-mix(in srgb,CanvasText 10%,transparent); }
.progress.show { display:block; }
.progress-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.progress-title { min-width:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.progress-state { flex:none; font-size:11px; font-weight:650; color:#2563eb; }
.progress-state.waiting { color:#d97706; }
.progress-state.blocked { color:#dc2626; }
.progress-state.completed { color:#16a34a; }
.progress-track { height:7px; margin-top:8px; border-radius:999px; overflow:hidden; background:color-mix(in srgb,CanvasText 9%,transparent); }
.progress-fill { height:100%; width:0; border-radius:inherit; background:color-mix(in srgb,#2563eb 74%,CanvasText 26%); transition:width .25s ease; }
.progress-fill.completed { background:#16a34a; }
.progress-meta { display:flex; justify-content:space-between; gap:10px; margin-top:5px; color:GrayText; font-size:11px; }
.progress-line { margin-top:6px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.progress-line b { font-weight:650; }
.progress-next,.progress-detail { color:GrayText; }
.progress[data-lifecycle="collapsed"] { display:block; padding-top:8px; }
.progress[data-lifecycle="collapsed"] .progress-track,
.progress[data-lifecycle="collapsed"] .progress-meta,
.progress[data-lifecycle="collapsed"] .progress-line { display:none; }
.foot { margin-top:9px; color:GrayText; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media(max-width:520px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));} .progress-meta{display:block;} }
@media(prefers-reduced-motion:reduce){ .progress-fill{transition:none;} }
</style>
<div class="card">
  <div class="head"><div class="title">⚡ Development Bridge</div><div id="status" class="badge">online</div></div>
  <div class="grid">
    <div class="cell"><div class="k">Tools</div><div id="tools" class="v">—</div></div>
    <div class="cell"><div class="k">Disk</div><div id="disk" class="v">—</div></div>
    <div class="cell"><div class="k">RAM free</div><div id="ram" class="v">—</div></div>
    <div class="cell"><div class="k">Projects</div><div id="projects" class="v">—</div></div>
  </div>
  <section id="progress" class="progress" data-lifecycle="expanded" aria-live="polite">
    <div class="progress-head">
      <div id="progressTitle" class="progress-title">Current work</div>
      <div id="progressState" class="progress-state">working</div>
    </div>
    <div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
    <div class="progress-meta"><span id="progressCount">—</span><span id="progressPhase">—</span></div>
    <div id="progressCurrent" class="progress-line"></div>
    <div id="progressNext" class="progress-line progress-next"></div>
    <div id="progressDetail" class="progress-line progress-detail"></div>
  </section>
  <div id="foot" class="foot">Compact tool surface</div>
</div>
<script type="module">
import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js";
const app = new App({name:"Development Bridge Dashboard",version:"1.1.0"},{autoResize:true});
const STATE_URI="bridge://development-bridge/dashboard-state";
const $ = id => document.getElementById(id);
let timer=null;
let currentProgress=null;
let boundOperationId=null;
let highestRenderedRevision=null;
let collapseTimer=null;
let pollingStopped=false;
const COLLAPSE_DELAY_MS=2500;
function text(id,value){ $(id).textContent=value ?? ""; }
function collapseProgress(reason){
  if(collapseTimer) clearTimeout(collapseTimer);
  pollingStopped=true;
  if(timer) clearTimeout(timer);
  const panel=$("progress");
  panel.dataset.lifecycle="collapsed";
  text("progressState",reason);
  $("progressState").className=`progress-state ${reason === "completed" ? "completed" : ""}`;
  text("progressTitle",`${currentProgress?.title || "Operation"} · ${reason}`);
  requestAnimationFrame(()=>{ try{ app.sendSizeChanged({height:document.documentElement.scrollHeight}); }catch(_){} });
}
function render(raw){
  const d=raw?.structuredContent || raw || {};
  text("status",d.status || "online");
  text("tools",`${d.visible_tools ?? "—"} / ${d.internal_tools ?? "—"}`);
  text("disk",d.disk ? `${d.disk.free_gib} GiB free` : "—");
  text("ram",d.memory ? `${d.memory.available_gib} GiB` : "—");
  text("projects",d.projects ?? "—");
  if(pollingStopped) return;
  const p=d.progress || null;
  if(p?.operation_id && boundOperationId && p.operation_id !== boundOperationId){
    collapseProgress("superseded");
    return;
  }
  if(p?.operation_id && !boundOperationId) boundOperationId=p.operation_id;
  const revision=typeof p?.revision === "number" && Number.isFinite(p.revision) ? p.revision : null;
  if(revision !== null && highestRenderedRevision !== null && revision < highestRenderedRevision) return;
  if(revision !== null) highestRenderedRevision=Math.max(highestRenderedRevision ?? revision,revision);
  const status=p?.status || "working";
  if(p && status !== "completed" && collapseTimer){
    clearTimeout(collapseTimer);
    collapseTimer=null;
  }
  currentProgress=p;
  const panel=$("progress");
  panel.classList.toggle("show",Boolean(p));
  if(p){
    panel.dataset.lifecycle="expanded";
    text("progressTitle",p.title || "Current work");
    text("progressState",status);
    $("progressState").className=`progress-state ${status}`;
    const percent=Math.max(0,Math.min(100,Number(p.percent) || 0));
    $("progressFill").style.width=`${percent}%`;
    $("progressFill").className=`progress-fill ${status === "completed" ? "completed" : ""}`;
    text("progressCount",`${p.completed ?? 0} / ${p.total ?? 0} · ${percent}%`);
    text("progressPhase",p.phase || "");
    text("progressCurrent",p.current ? `Сейчас: ${p.current}` : "");
    text("progressNext",p.next ? `Далее: ${p.next}` : "");
    text("progressDetail",p.detail || "");
    if(status === "completed" && !collapseTimer){
      collapseTimer=setTimeout(()=>collapseProgress("completed"),COLLAPSE_DELAY_MS);
    }
  }
  const route=d.route?.route_id ? ` · route ${d.route.route_id}` : "";
  text("foot",`${d.tool_surface || "compact"} surface${route} · live`);
  requestAnimationFrame(()=>{ try{ app.sendSizeChanged({height:document.documentElement.scrollHeight}); }catch(_){} });
}
function schedule(){
  if(timer) clearTimeout(timer);
  if(pollingStopped) return;
  const active=currentProgress && currentProgress.status !== "completed";
  timer=setTimeout(refresh,active ? 5000 : 20000);
}
async function refresh(){
  if(document.hidden){ schedule(); return; }
  const boundOperationIdAtStart=boundOperationId;
  try{
    const result=await app.readServerResource({uri:STATE_URI});
    const content=(result?.contents || []).find(item => typeof item?.text === "string");
    if(content){
      const snapshot=JSON.parse(content.text);
      const snapshotOperationId=snapshot?.progress?.operation_id;
      const bindingChanged=boundOperationId !== boundOperationIdAtStart;
      if(!bindingChanged || snapshotOperationId === boundOperationId) render(snapshot);
    }
  }catch(_){ /* keep last known state */ }
  schedule();
}
app.ontoolresult=render;
window.addEventListener("pagehide",()=>{ if(timer) clearTimeout(timer); },{once:true});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !pollingStopped){ if(timer) clearTimeout(timer); refresh(); } });
await app.connect();
schedule();
</script>

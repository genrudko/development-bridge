<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Development Bridge — Вход в панель оператора</title>
  <link rel="stylesheet" href="{{ base_path }}/static/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>Панель оператора</h2>
      {% if error %}
      <div class="alert-danger">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ base_path }}/login">
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" class="form-control" autofocus required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.6rem;">Войти</button>
      </form>
    </div>
  </div>
</body>
</html>

# GitHub host workflows are optional. The token is supplied only through
# DEVELOPMENT_BRIDGE_GITHUB_TOKEN and the optional external-contribution
# DEVELOPMENT_BRIDGE_GITHUB_CLASSIC_TOKEN, never in this file.
# github:
#   timeout_seconds: 20
#   response_limit_bytes: 2097152
#   artifact_directory: /absolute/path/to/development-bridge-github-artifacts
#   artifact_max_bytes: 268435456
#   artifact_export_ttl_seconds: 600
# Optional Community Knowledge corpus; keep it outside registered repositories.
# knowledge:
#   database_path: /absolute/path/to/development-bridge-knowledge.sqlite3
#   attachment_directory: /absolute/path/to/development-bridge-knowledge-attachments
#   attachment_max_bytes: 536870912
#   attachment_export_ttl_seconds: 600
#   telegram:
#     api_id: 12345
#     api_hash: replace-with-my-telegram-api-hash
#     session_path: /absolute/path/to/development-bridge-telegram.session
#     sync_batch_size: 2000
#     recent_window_size: 100
# OAuth is optional for local development. A remote private deployment enables it
# and supplies DEVELOPMENT_BRIDGE_OWNER_VERIFIER through its secret environment.
# oauth:
#   enabled: true
#   issuer_url: https://bridge.example
#   resource_url: https://bridge.example/mcp
#   database_path: /absolute/path/to/development-bridge-oauth.sqlite3
projects:
  - id: printer-stack
    name: Printer Stack
    repositories:
      - id: fluidd
        path: /absolute/path/to/fluidd
        capabilities:
          read: true
          git_read: true
          execute: true
        tasks:
          - id: test
            name: Run repository tests
            executable: .venv/bin/pytest
            arguments: ["-q"]
            timeout_seconds: 300
            output_limit_bytes: 262144
      - id: plugins-ad5x
        path: /absolute/path/to/Plugins_AD5X
        capabilities:
          read: true
          git_read: true

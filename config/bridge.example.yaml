version: 1
server:
  name: development-bridge
  host: 127.0.0.1
  port: 8789
  endpoint: /mcp
# Canonical HTTPS origin used only to construct short-lived external export URLs.
# public_base_url: https://bridge.example
  allowed_hosts: [127.0.0.1, "127.0.0.1:*", localhost, "localhost:*"]
jobs:
  database_path: /absolute/path/to/development-bridge-jobs.sqlite3

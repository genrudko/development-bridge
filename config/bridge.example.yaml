version: 1
server:
  name: development-bridge
  host: 127.0.0.1
  port: 8789
  endpoint: /mcp
  allowed_hosts: [127.0.0.1, "127.0.0.1:*", localhost, "localhost:*"]
jobs:
  database_path: /absolute/path/to/development-bridge-jobs.sqlite3
# Optional Community Knowledge corpus; keep it outside registered repositories.
# knowledge:
#   database_path: /absolute/path/to/development-bridge-knowledge.sqlite3
# OAuth is optional for local development. A remote private deployment enables it
# and supplies DEVELOPMENT_BRIDGE_OWNER_VERIFIER through its secret environment.
# oauth:
#   enabled: true
#   issuer_url: https://bridge.example
#   resource_url: https://bridge.example/mcp
#   database_path: /absolute/path/to/development-bridge-oauth.sqlite3
projects:
  - id: printer-stack
    name: Printer Stack
    repositories:
      - id: fluidd
        path: /absolute/path/to/fluidd
        capabilities:
          read: true
          git_read: true
          execute: true
        tasks:
          - id: test
            name: Run repository tests
            executable: .venv/bin/pytest
            arguments: ["-q"]
            timeout_seconds: 300
            output_limit_bytes: 262144
      - id: plugins-ad5x
        path: /absolute/path/to/Plugins_AD5X
        capabilities:
          read: true
          git_read: true
